# CodeQL, gitleaks and dependency review on pull requests. The jobs live in
# ChiefGyk3D/git-your-ship-together.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly, so new advisories surface between commits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@b9db99287236b19f0249f83b54acc5cc41126e42 # v1.25.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    with:
      codeql-languages: actions   # bash is not a CodeQL language; this scans the workflows
      pip-audit-requirements: ""   # no Python dependencies
      scorecard: false   # private repository for now
      egress-policy: block
